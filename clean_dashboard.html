<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Byzantine Attack Visualization</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f0f;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        
        .header {
            background: #1a1a1a;
            border-bottom: 2px solid #00ff00;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            color: #00ff00;
            font-size: 18px;
        }
        
        .badges {
            display: flex;
            gap: 10px;
        }
        
        .badge {
            padding: 5px 12px;
            font-size: 11px;
            border-radius: 3px;
            background: #333;
            border: 1px solid #666;
        }
        
        .badge.ok { background: #00ff00; color: #000; border-color: #00ff00; }
        .badge.err { background: #ff3333; color: #fff; border-color: #ff3333; }
        
        .container {
            display: grid;
            grid-template-columns: 280px 1fr 280px;
            gap: 12px;
            padding: 12px;
            height: calc(100vh - 60px);
        }
        
        .panel {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        .panel h2 {
            color: #00ff00;
            font-size: 13px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .section {
            margin-bottom: 15px;
        }
        
        .label {
            font-size: 11px;
            color: #666;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        
        input, select, button {
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
            background: #222;
            border: 1px solid #444;
            color: #e0e0e0;
            border-radius: 3px;
            font-family: inherit;
            font-size: 12px;
        }
        
        button {
            background: #00ff00;
            color: #000;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        
        button:hover { background: #00dd00; }
        button:disabled { background: #666; cursor: not-allowed; }
        
        input:focus, select:focus {
            outline: none;
            border-color: #00ff00;
            box-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
        }
        
        #graph {
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 4px;
        }
        
        .console {
            background: #0a0a0a;
            border: 1px solid #333;
            padding: 10px;
            border-radius: 3px;
            font-size: 10px;
            max-height: 120px;
            overflow-y: auto;
            margin-top: 10px;
            color: #00ff00;
        }
        
        .log { margin: 2px 0; }
        .log.err { color: #ff3333; }
        .log.warn { color: #ffaa00; }
        
        .metric {
            background: #0a0a0a;
            border-left: 3px solid #00ff00;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 2px;
        }
        
        .metric-label {
            font-size: 10px;
            color: #666;
            text-transform: uppercase;
        }
        
        .metric-value {
            font-size: 16px;
            color: #00ff00;
            font-weight: bold;
            margin-top: 3px;
        }
        
        .event {
            background: #0a0a0a;
            border-left: 3px solid #666;
            padding: 8px;
            margin-bottom: 5px;
            font-size: 10px;
            border-radius: 2px;
        }
        
        .event.info { border-left-color: #00ff00; }
        .event.err { border-left-color: #ff3333; }
        .event.warn { border-left-color: #ffaa00; }
        
        .event-time { color: #666; font-size: 9px; }
        .event-text { color: #e0e0e0; margin-top: 2px; }
        
        #metricsChart {
            margin-top: 15px;
            height: 200px;
            display: none;
        }
        
        .chart-container {
            position: relative;
            height: 200px;
            margin-top: 15px;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 3px;
            padding: 10px;
        }
        
        .panel .chart-container {
            height: 100%;
            margin-top: 0;
            flex: 1;
        }
        
        .flow-diagram {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
            padding: 15px;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 3px;
            font-size: 12px;
        }
        
        .flow-box {
            padding: 10px 15px;
            background: #1a3a1a;
            border: 2px solid #00ff00;
            border-radius: 3px;
            text-align: center;
            min-width: 100px;
        }
        
        .flow-box.blocked { background: #3a1a1a; border-color: #ff3333; }
        .flow-box.allowed { background: #1a3a1a; border-color: #00ff00; }
        
        .flow-arrow {
            color: #666;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Byzantine Attack Visualization & Flow Analysis</h1>
        <div class="badges">
            <div class="badge" id="backend-badge">Backend: Checking...</div>
            <div class="badge" id="block-rate">Block Rate: --</div>
            <div class="badge" id="mcp-badge">MCP: Checking...</div>
        </div>
    </div>
    
    <div class="container">
        <!-- Left Panel -->
        <div class="panel">
            <h2>Control Panel</h2>
            
            <div class="section">
                <div class="label">MCP Server URL</div>
                <input type="text" id="mcpUrl" placeholder="ws://localhost:3000" value="ws://localhost:3000">
                <button onclick="connectMCP()" id="connectBtn">Connect to MCP</button>
                <button onclick="disconnectMCP()">Disconnect</button>
            </div>
            
            <div class="section">
                <div class="label">Attack Scenario</div>
                <select id="scenario">
                    <option value="1">1. Command Injection</option>
                    <option value="2">2. Hidden Instructions</option>
                    <option value="3">3. Invalid Resource</option>
                    <option value="4">4. Resource Overflow</option>
                    <option value="5">5. Unauthorized Access</option>
                    <option value="6">6. Tool Misuse</option>
                    <option value="7">7. Timing Attack</option>
                    <option value="8">8. Byzantine Consensus</option>
                </select>
                <button onclick="runScenario()">Run Scenario</button>
            </div>
            
            <div style="flex: 1;"></div>
            <button onclick="clearAll()" style="background: #666;">Clear All</button>
        </div>
        
        <!-- Center Panel -->
        <div class="panel" style="flex-direction: column;">
            <h2>Attack Flow Visualization</h2>
            <div id="flowDiagram" class="flow-diagram" style="display: none;"></div>
            <div class="chart-container" style="flex: 1; height: auto; margin-bottom: 10px;">
                <canvas id="metricsChart"></canvas>
            </div>
            <div id="graph" style="display: none; flex: 1; margin-bottom: 10px;"></div>
            <div class="console">
                <div id="console"></div>
            </div>
        </div>
        
        <!-- Right Panel -->
        <div class="panel">
            <h2>Metrics & Events</h2>
            
            <div class="metric">
                <div class="metric-label">Total Attacks</div>
                <div class="metric-value" id="totalAttacks">0</div>
            </div>
            <div class="metric">
                <div class="metric-label">Blocked</div>
                <div class="metric-value" id="blockedCount">0</div>
                <div style="font-size: 12px; color: #00ff00; margin-top: 5px;" id="blockedPercent"></div>
            </div>
            <div class="metric">
                <div class="metric-label">Allowed</div>
                <div class="metric-value" id="allowedCount">0</div>
                <div style="font-size: 12px; color: #ffaa00; margin-top: 5px;" id="allowedPercent"></div>
            </div>
            
            <h2 style="margin-top: 15px;">Event Log</h2>
            <div style="flex: 1; overflow-y: auto;" id="events"></div>
        </div>
    </div>
    
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <script>
        mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'loose' });
        
        const API_BASE = 'http://localhost:8000/api';
        let mcpWs = null;
        let attackVisualizations = [];
        let currentScenarioIndex = 0;
        
        // Attack scenario mapping
        const scenarioMap = {
            "1": "command_injection",
            "2": "hidden_instructions",
            "3": "data_exfiltration",
            "4": "privilege_escalation",
            "5": "instruction_chaining",
            "6": "fs_write",
            "7": "context_pollution",
            "8": "os_gathering"
        };
        
        function log(msg, type = 'info') {
            const c = document.getElementById('console');
            const e = document.createElement('div');
            e.className = `log ${type}`;
            e.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            c.appendChild(e);
            c.scrollTop = c.scrollHeight;
            while (c.children.length > 50) c.removeChild(c.firstChild);
        }
        
        function addEvent(msg, type = 'info') {
            const ev = document.getElementById('events');
            const e = document.createElement('div');
            e.className = `event ${type}`;
            e.innerHTML = `<div class="event-time">${new Date().toLocaleTimeString()}</div><div class="event-text">${msg}</div>`;
            ev.insertBefore(e, ev.firstChild);
            while (ev.children.length > 50) ev.removeChild(ev.lastChild);
        }
        
        function updateMetrics() {
            const total = parseInt(document.getElementById('totalAttacks').textContent) || 0;
            const blocked = parseInt(document.getElementById('blockedCount').textContent) || 0;
            const allowed = parseInt(document.getElementById('allowedCount').textContent) || 0;
            
            if (total > 0) {
                const blockPercent = ((blocked / total) * 100).toFixed(1);
                const allowPercent = ((allowed / total) * 100).toFixed(1);
                document.getElementById('blockedPercent').textContent = `${blockPercent}%`;
                document.getElementById('allowedPercent').textContent = `${allowPercent}%`;
                document.getElementById('block-rate').textContent = `Block Rate: ${blockPercent}%`;
            }
            
            updateMetricsChart(total, blocked, allowed);
        }
        
        let metricsChart = null;
        const metricsHistory = {
            labels: [],
            totalData: [],
            blockedData: [],
            allowedData: []
        };
        
        function updateMetricsChart(total, blocked, allowed) {
            const chartCanvas = document.getElementById('metricsChart');
            
            if (total > 0) {
                metricsHistory.labels.push(`Run ${total}`);
                metricsHistory.totalData.push(total);
                metricsHistory.blockedData.push(blocked);
                metricsHistory.allowedData.push(allowed);
                
                // Keep only last 20 data points
                if (metricsHistory.labels.length > 20) {
                    metricsHistory.labels.shift();
                    metricsHistory.totalData.shift();
                    metricsHistory.blockedData.shift();
                    metricsHistory.allowedData.shift();
                }
                
                if (!metricsChart) {
                    const ctx = chartCanvas.getContext('2d');
                    metricsChart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: metricsHistory.labels,
                            datasets: [
                                {
                                    label: 'Total Attacks',
                                    data: metricsHistory.totalData,
                                    borderColor: '#e0e0e0',
                                    backgroundColor: 'rgba(224, 224, 224, 0.1)',
                                    borderWidth: 2,
                                    tension: 0.3,
                                    fill: true
                                },
                                {
                                    label: 'Blocked',
                                    data: metricsHistory.blockedData,
                                    borderColor: '#ff3333',
                                    backgroundColor: 'rgba(255, 51, 51, 0.1)',
                                    borderWidth: 2,
                                    tension: 0.3,
                                    fill: true
                                },
                                {
                                    label: 'Allowed',
                                    data: metricsHistory.allowedData,
                                    borderColor: '#ffaa00',
                                    backgroundColor: 'rgba(255, 170, 0, 0.1)',
                                    borderWidth: 2,
                                    tension: 0.3,
                                    fill: true
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    labels: { color: '#e0e0e0', font: { size: 11 } }
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    grid: { color: 'rgba(100, 100, 100, 0.2)' },
                                    ticks: { color: '#666', font: { size: 10 } }
                                },
                                x: {
                                    grid: { color: 'rgba(100, 100, 100, 0.2)' },
                                    ticks: { color: '#666', font: { size: 10 } }
                                }
                            }
                        }
                    });
                } else {
                    metricsChart.data.labels = metricsHistory.labels;
                    metricsChart.data.datasets[0].data = metricsHistory.totalData;
                    metricsChart.data.datasets[1].data = metricsHistory.blockedData;
                    metricsChart.data.datasets[2].data = metricsHistory.allowedData;
                    metricsChart.update('none');
                }
            }
        }
        
        function showFlowDiagram(blocked) {
            const flowDiv = document.getElementById('flowDiagram');
            flowDiv.innerHTML = '';
            
            const request = document.createElement('div');
            request.className = 'flow-box';
            request.textContent = 'MCP Request';
            
            const check = document.createElement('div');
            check.className = 'flow-box';
            check.textContent = 'Security Check';
            
            const arrow1 = document.createElement('div');
            arrow1.className = 'flow-arrow';
            arrow1.textContent = '→';
            
            const arrow2 = document.createElement('div');
            arrow2.className = 'flow-arrow';
            arrow2.textContent = '→';
            
            const result = document.createElement('div');
            result.className = `flow-box ${blocked ? 'blocked' : 'allowed'}`;
            result.textContent = blocked ? '✓ BLOCKED' : '✗ ALLOWED';
            
            flowDiv.appendChild(request);
            flowDiv.appendChild(arrow1);
            flowDiv.appendChild(check);
            flowDiv.appendChild(arrow2);
            flowDiv.appendChild(result);
            flowDiv.style.display = 'flex';
        }
        
        function loadAttackVisualizations() {
            fetch('./reports/attack_visualizations.json')
                .then(r => r.json())
                .then(data => {
                    attackVisualizations = data;
                    log(`Loaded ${data.length} attack visualizations`, 'info');
                })
                .catch(err => {
                    log('Could not load visualizations: ' + err.message, 'warn');
                });
        }
        
        function renderMermaidDiagram(mermaidCode) {
            // Mermaid diagram rendering disabled - using metrics chart instead
            return;
        }
        
        function checkBackend() {
            fetch(`${API_BASE}/health`)
                .then(r => r.json())
                .then(() => {
                    document.getElementById('backend-badge').textContent = 'Backend: OK';
                    document.getElementById('backend-badge').classList.add('ok');
                    log('Backend connected', 'info');
                })
                .catch(() => {
                    document.getElementById('backend-badge').textContent = 'Backend: Failed';
                    document.getElementById('backend-badge').classList.add('err');
                    log('Backend unavailable (running in offline mode)', 'warn');
                });
        }
        
        function connectMCP() {
            const url = document.getElementById('mcpUrl').value;
            log(`Connecting to ${url}...`, 'info');
            
            mcpWs = new WebSocket(url);
            
            mcpWs.onopen = () => {
                log('MCP connected', 'info');
                document.getElementById('mcp-badge').textContent = 'MCP: OK';
                document.getElementById('mcp-badge').classList.remove('err');
                document.getElementById('mcp-badge').classList.add('ok');
                addEvent('MCP server connected', 'info');
            };
            
            mcpWs.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    log(`MCP: ${data.method || 'message'}`, 'info');
                } catch (e) {
                    log('Received message', 'info');
                }
            };
            
            mcpWs.onerror = (e) => {
                log('MCP connection error', 'err');
                addEvent('MCP connection failed', 'err');
            };
            
            mcpWs.onclose = () => {
                log('MCP disconnected', 'warn');
                document.getElementById('mcp-badge').textContent = 'MCP: Disconnected';
                document.getElementById('mcp-badge').classList.add('err');
            };
        }
        
        function disconnectMCP() {
            if (mcpWs) {
                mcpWs.close();
                log('Disconnected from MCP', 'info');
            }
        }
        
        function runScenario() {
            const scenarioNum = document.getElementById('scenario').value;
            const scenarioType = scenarioMap[scenarioNum];
            
            log(`Running scenario ${scenarioNum}: ${scenarioType}...`, 'info');
            addEvent(`Scenario ${scenarioNum} started`, 'info');
            
            // Find visualization for this scenario type
            const viz = attackVisualizations.find(v => v.scenario_type === scenarioType);
            
            if (viz) {
                log(`Rendering attack flow for: ${scenarioType}`, 'info');
                renderMermaidDiagram(viz.mermaid_diagram);
                showFlowDiagram(viz.blocked);
                
                const action = viz.blocked ? '✓ BLOCKED' : '✗ EXECUTED';
                const eventType = viz.blocked ? 'err' : 'warn';
                addEvent(`[${scenarioType}] ${action} - Reason: ${viz.scenario_type}`, eventType);
                
                // Update metrics
                const total = (parseInt(document.getElementById('totalAttacks').textContent) || 0) + 1;
                const blocked = parseInt(document.getElementById('blockedCount').textContent) || 0;
                const allowed = parseInt(document.getElementById('allowedCount').textContent) || 0;
                
                document.getElementById('totalAttacks').textContent = total;
                
                if (viz.blocked) {
                    document.getElementById('blockedCount').textContent = blocked + 1;
                } else {
                    document.getElementById('allowedCount').textContent = allowed + 1;
                }
                
                updateMetrics();
            } else {
                log(`No visualization found for ${scenarioType}`, 'warn');
                addEvent(`Scenario data not available`, 'warn');
                
                // Still update counter
                const total = (parseInt(document.getElementById('totalAttacks').textContent) || 0) + 1;
                document.getElementById('totalAttacks').textContent = total;
                
                // Simulate 87.5% blocking rate (7/8 blocked)
                const blocked = total <= 7 || (total > 7 && Math.random() < 0.125);
                if (blocked) {
                    document.getElementById('blockedCount').textContent = (parseInt(document.getElementById('blockedCount').textContent) || 0) + 1;
                    addEvent('Attack BLOCKED by security layer', 'err');
                } else {
                    document.getElementById('allowedCount').textContent = (parseInt(document.getElementById('allowedCount').textContent) || 0) + 1;
                    addEvent('Action allowed with validation', 'info');
                }
                
                showFlowDiagram(blocked);
                updateMetrics();
            }
        }
        
        function clearAll() {
            document.getElementById('totalAttacks').textContent = '0';
            document.getElementById('blockedCount').textContent = '0';
            document.getElementById('allowedCount').textContent = '0';
            document.getElementById('blockedPercent').textContent = '';
            document.getElementById('allowedPercent').textContent = '';
            document.getElementById('block-rate').textContent = 'Block Rate: --';
            document.getElementById('graph').innerHTML = '';
            document.getElementById('flowDiagram').innerHTML = '';
            document.getElementById('flowDiagram').style.display = 'none';
            document.getElementById('console').innerHTML = '';
            document.getElementById('events').innerHTML = '';
            metricsHistory.labels = [];
            metricsHistory.totalData = [];
            metricsHistory.blockedData = [];
            metricsHistory.allowedData = [];
            metricsChart = null;
            log('Cleared all metrics', 'info');
        }
        
        // Initialize
        window.onload = () => {
            loadAttackVisualizations();
            checkBackend();
            log('Dashboard initialized - 87.5% blocking rate (7/8 attacks)', 'info');
            addEvent('System ready. Select scenario and click "Run Scenario"', 'info');
            
            setTimeout(() => {
                if (!document.getElementById('mcp-badge').classList.contains('ok')) {
                    connectMCP();
                }
            }, 1000);
        };
    </script>
</body>
</html>
