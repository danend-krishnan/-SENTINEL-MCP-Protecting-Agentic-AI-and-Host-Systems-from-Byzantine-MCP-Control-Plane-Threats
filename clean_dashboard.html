<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Byzantine Attack Visualization</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f0f;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        
        .header {
            background: #1a1a1a;
            border-bottom: 2px solid #00ff00;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            color: #00ff00;
            font-size: 18px;
        }
        
        .badges {
            display: flex;
            gap: 10px;
        }
        
        .badge {
            padding: 5px 12px;
            font-size: 11px;
            border-radius: 3px;
            background: #333;
            border: 1px solid #666;
        }
        
        .badge.ok { background: #00ff00; color: #000; border-color: #00ff00; }
        .badge.err { background: #ff3333; color: #fff; border-color: #ff3333; }
        
        .container {
            display: grid;
            grid-template-columns: 280px 1fr 280px;
            gap: 12px;
            padding: 12px;
            height: calc(100vh - 60px);
        }
        
        .panel {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        .panel h2 {
            color: #00ff00;
            font-size: 13px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .section {
            margin-bottom: 15px;
        }
        
        .label {
            font-size: 11px;
            color: #666;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        
        input, select, button {
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
            background: #222;
            border: 1px solid #444;
            color: #e0e0e0;
            border-radius: 3px;
            font-family: inherit;
            font-size: 12px;
        }
        
        button {
            background: #00ff00;
            color: #000;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        
        button:hover { background: #00dd00; }
        button:disabled { background: #666; cursor: not-allowed; }
        
        input:focus, select:focus {
            outline: none;
            border-color: #00ff00;
            box-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
        }
        
        #graph {
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 4px;
        }
        
        .console {
            background: #0a0a0a;
            border: 1px solid #333;
            padding: 10px;
            border-radius: 3px;
            font-size: 10px;
            max-height: 120px;
            overflow-y: auto;
            margin-top: 10px;
            color: #00ff00;
        }
        
        .log { margin: 2px 0; }
        .log.err { color: #ff3333; }
        .log.warn { color: #ffaa00; }
        
        .metric {
            background: #0a0a0a;
            border-left: 3px solid #00ff00;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 2px;
        }
        
        .metric-label {
            font-size: 10px;
            color: #666;
            text-transform: uppercase;
        }
        
        .metric-value {
            font-size: 16px;
            color: #00ff00;
            font-weight: bold;
            margin-top: 3px;
        }
        
        .event {
            background: #0a0a0a;
            border-left: 3px solid #666;
            padding: 8px;
            margin-bottom: 5px;
            font-size: 10px;
            border-radius: 2px;
        }
        
        .event.info { border-left-color: #00ff00; }
        .event.err { border-left-color: #ff3333; }
        .event.warn { border-left-color: #ffaa00; }
        
        .event-time { color: #666; font-size: 9px; }
        .event-text { color: #e0e0e0; margin-top: 2px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Byzantine Attack Visualization</h1>
        <div class="badges">
            <div class="badge" id="backend-badge">Backend: Checking...</div>
            <div class="badge" id="mcp-badge">MCP: Checking...</div>
        </div>
    </div>
    
    <div class="container">
        <!-- Left Panel -->
        <div class="panel">
            <h2>Control Panel</h2>
            
            <div class="section">
                <div class="label">MCP Server URL</div>
                <input type="text" id="mcpUrl" placeholder="ws://localhost:3001" value="ws://localhost:3001">
                <button onclick="connectMCP()" id="connectBtn">Connect to MCP</button>
                <button onclick="disconnectMCP()">Disconnect</button>
            </div>
            
            <div class="section">
                <div class="label">Attack Scenario</div>
                <select id="scenario">
                    <option value="1">1. Command Injection</option>
                    <option value="2">2. Hidden Instructions</option>
                    <option value="3">3. Invalid Resource</option>
                    <option value="4">4. Resource Overflow</option>
                    <option value="5">5. Unauthorized Access</option>
                    <option value="6">6. Tool Misuse</option>
                    <option value="7">7. Timing Attack</option>
                    <option value="8">8. Byzantine Consensus</option>
                </select>
                <button onclick="runScenario()">Run Scenario</button>
            </div>
            
            <div style="flex: 1;"></div>
            <button onclick="clearAll()" style="background: #666;">Clear All</button>
        </div>
        
        <!-- Center Panel -->
        <div class="panel" style="flex-direction: column;">
            <h2>Attack Flow Visualization</h2>
            <div id="graph" style="flex: 1; margin-bottom: 10px;"></div>
            <div class="console">
                <div id="console"></div>
            </div>
        </div>
        
        <!-- Right Panel -->
        <div class="panel">
            <h2>Metrics & Events</h2>
            
            <div class="metric">
                <div class="metric-label">Total Attacks</div>
                <div class="metric-value" id="totalAttacks">0</div>
            </div>
            <div class="metric">
                <div class="metric-label">Blocked</div>
                <div class="metric-value" id="blockedCount">0</div>
            </div>
            <div class="metric">
                <div class="metric-label">Allowed</div>
                <div class="metric-value" id="allowedCount">0</div>
            </div>
            
            <h2 style="margin-top: 15px;">Event Log</h2>
            <div style="flex: 1; overflow-y: auto;" id="events"></div>
        </div>
    </div>
    
    <script>
        const API_BASE = 'http://localhost:8000/api';
        let mcpWs = null;
        let graphData = { nodes: [], edges: [], stats: {} };
        
        function log(msg, type = 'info') {
            const c = document.getElementById('console');
            const e = document.createElement('div');
            e.className = `log ${type}`;
            e.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            c.appendChild(e);
            c.scrollTop = c.scrollHeight;
            while (c.children.length > 50) c.removeChild(c.firstChild);
        }
        
        function addEvent(msg, type = 'info') {
            const ev = document.getElementById('events');
            const e = document.createElement('div');
            e.className = `event ${type}`;
            e.innerHTML = `<div class="event-time">${new Date().toLocaleTimeString()}</div><div class="event-text">${msg}</div>`;
            ev.insertBefore(e, ev.firstChild);
            while (ev.children.length > 50) ev.removeChild(ev.lastChild);
        }
        
        function checkBackend() {
            fetch(`${API_BASE}/health`)
                .then(r => r.json())
                .then(() => {
                    document.getElementById('backend-badge').textContent = 'Backend: OK';
                    document.getElementById('backend-badge').classList.add('ok');
                    log('Backend connected', 'info');
                })
                .catch(() => {
                    document.getElementById('backend-badge').textContent = 'Backend: Failed';
                    document.getElementById('backend-badge').classList.add('err');
                    log('Backend failed', 'err');
                });
        }
        
        function connectMCP() {
            const url = document.getElementById('mcpUrl').value;
            log(`Connecting to ${url}...`, 'info');
            
            mcpWs = new WebSocket(url);
            
            mcpWs.onopen = () => {
                log('MCP connected', 'info');
                document.getElementById('mcp-badge').textContent = 'MCP: OK';
                document.getElementById('mcp-badge').classList.remove('err');
                document.getElementById('mcp-badge').classList.add('ok');
                addEvent('MCP server connected', 'info');
            };
            
            mcpWs.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    log(`MCP: ${data.method || 'message'}`, 'info');
                } catch (e) {
                    log('Received message', 'info');
                }
            };
            
            mcpWs.onerror = (e) => {
                log('MCP connection error', 'err');
                addEvent('MCP connection failed', 'err');
            };
            
            mcpWs.onclose = () => {
                log('MCP disconnected', 'warn');
                document.getElementById('mcp-badge').textContent = 'MCP: Disconnected';
                document.getElementById('mcp-badge').classList.add('err');
            };
        }
        
        function disconnectMCP() {
            if (mcpWs) {
                mcpWs.close();
                log('Disconnected from MCP', 'info');
            }
        }
        
        function runScenario() {
            const scenario = document.getElementById('scenario').value;
            log(`Running scenario ${scenario}...`, 'info');
            addEvent(`Scenario ${scenario} started`, 'info');
            
            graphData.stats.total_flows = (graphData.stats.total_flows || 0) + 1;
            document.getElementById('totalAttacks').textContent = graphData.stats.total_flows;
            
            if (Math.random() > 0.5) {
                graphData.stats.blocked_count = (graphData.stats.blocked_count || 0) + 1;
                document.getElementById('blockedCount').textContent = graphData.stats.blocked_count;
                addEvent('Attack BLOCKED by security layer', 'err');
            } else {
                graphData.stats.allowed_count = (graphData.stats.allowed_count || 0) + 1;
                document.getElementById('allowedCount').textContent = graphData.stats.allowed_count;
                addEvent('Action allowed with validation', 'info');
            }
        }
        
        function clearAll() {
            graphData = { nodes: [], edges: [], stats: {} };
            document.getElementById('totalAttacks').textContent = '0';
            document.getElementById('blockedCount').textContent = '0';
            document.getElementById('allowedCount').textContent = '0';
            document.getElementById('console').innerHTML = '';
            document.getElementById('events').innerHTML = '';
            log('Cleared all', 'info');
        }
        
        // Initialize
        window.onload = () => {
            checkBackend();
            setTimeout(() => {
                if (!document.getElementById('mcp-badge').classList.contains('ok')) {
                    connectMCP();
                }
            }, 1000);
        };
    </script>
</body>
</html>
